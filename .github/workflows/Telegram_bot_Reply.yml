name: Telegram Bot Reply

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  bot-reply:
    runs-on: ubuntu-latest

    steps:
      - name: Get Telegram message and reply
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          token = os.environ["BOT_TOKEN"]

          # Remove webhook so getUpdates can work
          delete_url = f"https://api.telegram.org/bot{token}/deleteWebhook?drop_pending_updates=false"
          delete_result = json.loads(
              urllib.request.urlopen(delete_url).read()
          )

          print("Webhook:", delete_result)

          # Get latest Telegram update
          get_url = f"https://api.telegram.org/bot{token}/getUpdates?offset=-1&timeout=5"
          result = json.loads(
              urllib.request.urlopen(get_url).read()
          )

          print("Telegram result:", result)

          if not result.get("ok"):
              print("Telegram API error")
              exit(1)

          updates = result.get("result", [])

          if not updates:
              print("No new Telegram messages found.")
              exit()

          update = updates[-1]
          update_id = update["update_id"]
          message = update.get("message")

          if not message:
              print("Latest update has no message.")
              exit()

          chat_id = message["chat"]["id"]
          text = message.get("text", "").strip()

          print("Received:", text)
          print("Chat ID:", chat_id)

          if text == "/start":
              reply = "Welcome to Railway Updates Pro 🚆\n\nBot is working successfully! ✅"

          elif text.lower() in ["hi", "hello", "hii"]:
              reply = "Hello 👋 Railway Updates Pro ki welcome! 🚆"

          else:
              reply = "Message received ✅\n\nRailway Updates Pro 🚆"

          send_url = f"https://api.telegram.org/bot{token}/sendMessage"

          params = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": reply
          })

          send_result = json.loads(
              urllib.request.urlopen(
                  send_url + "?" + params
              ).read()
          )

          print("Send result:", send_result)

          if send_result.get("ok"):
              print("Reply sent successfully ✅")
          else:
              print("Reply failed ❌")

          # Confirm/update offset so the same message is not processed again
          confirm_url = f"https://api.telegram.org/bot{token}/getUpdates?offset={update_id + 1}"
          urllib.request.urlopen(confirm_url).read()

          print("Update confirmed:", update_id)
          PY
