name: Telegram Bot Reply

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  bot-reply:
    runs-on: ubuntu-latest

    steps:
      - name: Get Telegram messages and reply
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          token = os.environ["BOT_TOKEN"]

          url = f"https://api.telegram.org/bot{token}/getUpdates"
          data = urllib.request.urlopen(url).read()
          result = json.loads(data)

          if not result.get("ok"):
              print("Telegram API error")
              exit()

          for update in result.get("result", []):
              message = update.get("message")

              if not message:
                  continue

              chat_id = message["chat"]["id"]
              text = message.get("text", "").strip()

              if text == "/start":
                  reply = "Welcome to Railway Updates Pro 🚆\n\nRailway updates kosam stay connected! 👍"

              elif text.lower() in ["hi", "hello", "hii"]:
                  reply = "Hello 👋 Railway Updates Pro ki welcome! 🚆"

              else:
                  reply = "Message received ✅\n\nRailway Updates Pro 🚆"

              send_url = f"https://api.telegram.org/bot{token}/sendMessage"

              params = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": reply
              })

              urllib.request.urlopen(
                  send_url + "?" + params
              )

              print("Reply sent to:", chat_id)
          PY
